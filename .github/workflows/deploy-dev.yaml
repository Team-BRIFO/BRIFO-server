name: Deploy dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ASG_NAME: ${{ vars.ASG_NAME }}
  EC2_DEPLOY_SCRIPT_PATH: ${{ vars.EC2_DEPLOY_SCRIPT_PATH }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to ASG via SSM
        shell: bash
        run: |
          set -euo pipefail

          command_id="$(
            aws ssm send-command \
              --targets \
                "Key=tag:aws:autoscaling:groupName,Values=${ASG_NAME}" \
              --document-name AWS-RunShellScript \
              --parameters "commands=[\"${EC2_DEPLOY_SCRIPT_PATH} ${GITHUB_SHA}\"]" \
              --max-concurrency "100%" \
              --max-errors "0" \
              --query "Command.CommandId" \
              --output text
          )"

          while true; do
            status="$(
              aws ssm list-commands \
                --command-id "${command_id}" \
                --query "Commands[0].Status" \
                --output text
            )"

            case "${status}" in
              Success)
                aws ssm list-command-invocations \
                  --command-id "${command_id}" \
                  --query "CommandInvocations[].{InstanceId:InstanceId,Status:Status,StatusDetails:StatusDetails}" \
                  --output table
                echo "Deployment succeeded."
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                aws ssm list-command-invocations \
                  --command-id "${command_id}" \
                  --details \
                  --query 'CommandInvocations[].{
                    InstanceId:InstanceId,
                    Status:Status,
                    Output:CommandPlugins[0].Output
                  }'
                exit 1
                ;;
            esac
          done
