services:
  postgres:
    image: postgres:18
    container_name: brifo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - brifo-postgres-data:/var/lib/postgresql
  valkey:
    image: valkey/valkey:9.1.1-alpine
    container_name: brifo-valkey
    ports:
      - "6379:6379"

volumes:
  brifo-postgres-data:
