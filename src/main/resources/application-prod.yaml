spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: false
  web:
    error:
      include-message: never
      include-binding-errors: never

app:
  auth:
    signup-cookie:
      secure: true
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uris: ${KAKAO_REDIRECT_URIS}
      connect-timeout: 3s
      read-timeout: 5s
    naver:
      client-id: ${NAVER_CLIENT_ID}
      client-secret: ${NAVER_CLIENT_SECRET}
      redirect-uris: ${NAVER_REDIRECT_URIS}
      connect-timeout: 3s
      read-timeout: 5s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

external:
  data-server:
    base-url: ${DATA_SERVER_BASE_URL}
  ai:
    base-url: ${AI_BASE_URL}
    api-key: ${AI_INTERNAL_API_KEY}
  naver:
    client-id: ${NAVER_NEWS_CLIENT_ID}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET}
