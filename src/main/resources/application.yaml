spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  profiles:
    default: dev
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    init-sqls:
      - SET TIME ZONE 'Asia/Seoul'
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  batch:
    scheduling-enabled: ${BATCH_SCHEDULING_ENABLED:false}
    restart-delay: 10m
    max-executions: 3
    # 관심종목으로 담은 유저가 없어도 항상 뉴스를 수집·생성할 종목.
    # 코스피200 전체(R__stocks.sql 시드와 동일한 200개)를 기본값으로 둔다. 상위 10종목만
    # 넣었을 때는 나머지 190개 종목의 뉴스가 영원히 0건이었다.
    default-watchlist-codes: ${BATCH_DEFAULT_WATCHLIST_CODES:000070,000080,000100,000120,000140,000150,000210,000240,000270,000660,000670,000720,000810,000880,000990,001040,001120,001230,001430,001440,001450,001680,001800,002320,002350,002380,002790,003090,003230,003240,003490,003550,003670,003850,004000,004020,004170,004370,004490,004800,004990,005180,005250,005300,005380,005490,005830,005850,005930,005940,005950,006040,006260,006280,006360,006400,006800,007070,007310,008350,008770,008930,009150,009420,009540,009900,010060,010120,010130,010140,010950,011070,011170,011200,011210,011780,011790,012330,012450,012510,012630,013890,014680,014820,014830,015760,016360,018260,020000,020150,021240,023590,024110,026960,028050,028260,028670,029460,029780,030000,030200,031430,032640,032830,033780,034020,034220,034310,034730,035250,035420,035720,036460,036570,039130,039490,042660,042670,042700,047040,047050,047810,051600,051900,051910,052690,055550,064350,064960,066570,068270,069260,069620,069960,071050,073240,078930,079160,079550,081660,086280,086790,090430,093050,093370,096770,097950,103140,105560,105630,111770,112610,114090,120110,128940,138040,138930,139480,145020,161390,161890,175330,180640,192400,192820,200130,204320,207940,241560,248070,259960,267250,267260,267270,271560,272210,282330,285130,294870,298000,298020,298050,302440,306200,316140,323410,326030,329180,336260,352820,353200,361610,373220,375500,377300,383220,383800,402340,453810,456040}
    # 종목당 하루 카드 장수. 수집 범위를 넓히면 (종목 수 × 이 값)만큼 AI 생성이 일어나므로
    # 배포 없이 조정할 수 있어야 한다.
    news-cards-per-stock: ${BATCH_NEWS_CARDS_PER_STOCK:2}
    # 생성 실패를 건너뛸 수 있는 최대 개수. 이 수를 넘으면 생성 잡 전체가 중단되므로
    # 대상 종목 수에 맞춰 올릴 수 있어야 한다.
    news-card-generation-skip-limit: ${BATCH_NEWS_CARD_GENERATION_SKIP_LIMIT:120}
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}
  data-provider:
    type: ${DATA_PROVIDER:data-server}
  stock-price:
    cache-ttl: 60s
    last-success-ttl: 3m
  share-image:
    bucket: ${SHARE_IMAGE_BUCKET:disabled}
    region: ${AWS_REGION:ap-northeast-2}
    font-family: ${SHARE_IMAGE_FONT_FAMILY:Noto Sans CJK KR}
    width: ${SHARE_IMAGE_WIDTH:1200}
    height: ${SHARE_IMAGE_HEIGHT:630}

external:
  data-server:
    base-url: ${DATA_SERVER_BASE_URL:disabled}
    connect-timeout: 3s
    read-timeout: 5s
  kis:
    base-url: ${KIS_BASE_URL:disabled}
    app-key: ${KIS_APP_KEY:disabled}
    app-secret: ${KIS_APP_SECRET:disabled}
  toss:
    client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
    secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
