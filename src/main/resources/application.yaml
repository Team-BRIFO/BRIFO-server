spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  batch:
    scheduling-enabled: ${BATCH_SCHEDULING_ENABLED:false}
    restart-delay: 10m
    max-executions: 3
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}
  stock-price:
    cache-ttl: 60s
    last-success-ttl: 3m

external:
  kis:
    base-url: https://openapi.koreainvestment.com:9443
    app-key: ${KIS_APP_KEY}
    app-secret: ${KIS_APP_SECRET}
