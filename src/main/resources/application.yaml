spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uris: ${KAKAO_REDIRECT_URIS}
      connect-timeout: 3s
      read-timeout: 5s
