spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}
