spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  profiles:
    default: dev
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    init-sqls:
      - SET TIME ZONE 'Asia/Seoul'
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  batch:
    scheduling-enabled: ${BATCH_SCHEDULING_ENABLED:false}
    restart-delay: 10m
    max-executions: 3
    # 관심종목으로 담은 유저가 없어도 항상 뉴스를 수집·생성할 종목. 기본값은 BatchProperties 참고.
    default-watchlist-codes: ${BATCH_DEFAULT_WATCHLIST_CODES:005930,000660,373220,207940,005380,000270,068270,005490,035420,035720}
    # 종목당 하루 카드 장수. 수집 범위를 넓히면 (종목 수 × 이 값)만큼 AI 생성이 일어나므로
    # 배포 없이 조정할 수 있어야 한다.
    news-cards-per-stock: ${BATCH_NEWS_CARDS_PER_STOCK:3}
    # 생성 실패를 건너뛸 수 있는 최대 개수. 이 수를 넘으면 생성 잡 전체가 중단되므로
    # 대상 종목 수에 맞춰 올릴 수 있어야 한다.
    news-card-generation-skip-limit: ${BATCH_NEWS_CARD_GENERATION_SKIP_LIMIT:20}
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}
  data-provider:
    type: ${DATA_PROVIDER:data-server}
  stock-price:
    cache-ttl: 60s
    last-success-ttl: 3m
  share-image:
    bucket: ${SHARE_IMAGE_BUCKET:disabled}
    region: ${AWS_REGION:ap-northeast-2}
    font-family: ${SHARE_IMAGE_FONT_FAMILY:Noto Sans CJK KR}
    width: ${SHARE_IMAGE_WIDTH:1200}
    height: ${SHARE_IMAGE_HEIGHT:630}

external:
  data-server:
    base-url: ${DATA_SERVER_BASE_URL:disabled}
    connect-timeout: 3s
    read-timeout: 5s
  kis:
    base-url: ${KIS_BASE_URL:disabled}
    app-key: ${KIS_APP_KEY:disabled}
    app-secret: ${KIS_APP_SECRET:disabled}
  toss:
    client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
    secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
