spring:
  application:
    name: server
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
  profiles:
    default: dev
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    init-sqls:
      - SET TIME ZONE 'Asia/Seoul'
    locations: classpath:db/migration,classpath:db/data
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  batch:
    scheduling-enabled: ${BATCH_SCHEDULING_ENABLED:false}
    restart-delay: 10m
    max-executions: 3
  auth:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: brifo
      access-token-expiration: 1h
      refresh-token-expiration: 7d
      signup-token-expiration: 10m
    refresh-token:
      cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}
  stock-price:
    provider: ${STOCK_PRICE_PROVIDER:data-server}
    cache-ttl: 60s
    last-success-ttl: 3m

external:
  data-server:
    base-url: ${DATA_SERVER_BASE_URL:disabled}
    connect-timeout: 3s
    read-timeout: 5s
  kis:
    base-url: ${KIS_BASE_URL:disabled}
    app-key: ${KIS_APP_KEY:disabled}
    app-secret: ${KIS_APP_SECRET:disabled}
