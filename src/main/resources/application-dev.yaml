spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  web:
    error:
      include-message: always
      include-binding-errors: always

app:
  dev-behavior:
    immediate-interest-stock-updates: true
    briefing-time-restrictions-enabled: false
    decision-request-cutoff-enabled: false
    immediate-decision-settlement: true
    # 데모데이(토) 부스 시연용. 주말에도 브리핑·예측을 받고 직전 거래일 종가로 즉시 정산한다.
    # 시연이 끝나면 false로 되돌린다.
    weekend-market-enabled: true
  auth:
    signup-cookie:
      secure: false
    kakao:
      client-id: ${KAKAO_CLIENT_ID:disabled}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uris: ${KAKAO_REDIRECT_URIS:disabled}
      connect-timeout: 3s
      read-timeout: 5s
    naver:
      client-id: ${NAVER_CLIENT_ID:disabled}
      client-secret: ${NAVER_CLIENT_SECRET:disabled}
      redirect-uris: ${NAVER_REDIRECT_URIS:disabled}
      connect-timeout: 3s
      read-timeout: 5s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
    password: ${DEV_AUTH_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    with-credentials: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

external:
  data-server:
    base-url: ${DATA_SERVER_BASE_URL:disabled}
  ai:
    base-url: ${AI_BASE_URL:disabled}
    api-key: ${AI_INTERNAL_API_KEY:disabled}
  naver:
    client-id: ${NAVER_NEWS_CLIENT_ID:disabled}
    client-secret: ${NAVER_NEWS_CLIENT_SECRET:disabled}

server:
  forward-headers-strategy: framework
