spring:
  flyway:
    locations: classpath:db/migration,classpath:db/dev
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  web:
    error:
      include-message: always
      include-binding-errors: always

app:
  auth:
    signup-cookie:
      secure: false
    kakao:
      client-id: ${KAKAO_CLIENT_ID:disabled}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uris: ${KAKAO_REDIRECT_URIS:disabled}
      connect-timeout: 3s
      read-timeout: 5s
    naver:
      client-id: ${NAVER_CLIENT_ID:disabled}
      client-secret: ${NAVER_CLIENT_SECRET:disabled}
      redirect-uris: ${NAVER_REDIRECT_URIS:disabled}
      connect-timeout: 3s
      read-timeout: 5s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  dev-auth:
    enabled: ${DEV_AUTH_ENABLED:false}
    password: ${DEV_AUTH_PASSWORD:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

external:
  kis:
    base-url: ${KIS_BASE_URL:disabled}

server:
  forward-headers-strategy: framework
