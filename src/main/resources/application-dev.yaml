spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  web:
    error:
      include-message: always
      include-binding-errors: always

app:
  auth:
    kakao:
      client-id: disabled
      client-secret: disabled
      redirect-uris:
        - disabled
      connect-timeout: 3s
      read-timeout: 5s
    naver:
      client-id: disabled
      client-secret: disabled
      redirect-uris:
        - disabled
      connect-timeout: 3s
      read-timeout: 5s
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

external:
  kis:
    base-url: ${KIS_BASE_URL:disabled}
