spring:
  flyway:
    locations: classpath:db/migration
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  auth:
    kakao:
      client-id: disabled
      client-secret: disabled
      redirect-uris:
        - disabled
      connect-timeout: 3s
      read-timeout: 5s
    naver:
      client-id: disabled
      client-secret: disabled
      redirect-uris:
        - disabled
      connect-timeout: 3s
      read-timeout: 5s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

external:
  data-server:
    base-url: disabled
  ai:
    base-url: disabled
    api-key: disabled
  naver:
    client-id: disabled
    client-secret: disabled
